ular culture of Karnataka state. He is widely revered as \"Karunada Karna\"(English: Karna of Karnataka) for his numerous charity works. Ambareesh was felicitated with the honorary doctorate from the Dharwad university in 2013 at their 63rd annual convocation ceremony.His grandfather was the popular violin player, Chowdiah. Ambareesh completed his schooling in Mandya. Ambareesh has since appeared in about 208 film since including other films of Kanagal such as Paduvaaralli Pandavaru,Shubhamangala, Masanada Hoovu and Ranganayaki,Antha. As in 2010, Ambareesh had acted in most films as lead in Kannada films, surpassing Rajkumar's record of 206 films as lead actor and Vishnuvardhan's record of 230 films (including Kannada, Hindi, Telugu, Tamil and Malayalam films) as a lead actor. The record has not been broken yet. His other notable films include Ranganayaki, Tony, Rani Maharani, Olavina Udugore, Hrudaya Haadithu, Hongkongnalli Agent Amar, Mannina Doni and Odahuttidavaru. His performance in Masanada Hoovu, Elu Suttina Kote and the Malayalam film Gaanam were critically acclaimed. He also showed the great performance in mamateya madilu,elu sutinaa kote and mouna raga. He also acted with legend Rajkumar. He was the first Kannada actor to inaugurate the world famous Mysore Dasara festival organized by the government of Karnataka. He also won the Karnataka Government's Dr. Vishnuvardhan Award in the year 2011. Vishnuvardhan and Ambareesh debuted together in Nagarahavu under Putanna Kanagal's direction. From then they have been larger-than-life friends. They acted in Snehitara sawaal, Maha Prachandaru and Avala Hejje in the 80s. Again they came together in Diggajaru in 2000 and this film is remembered by their fans as their best. It had the memorable hit \"Kuchikku, Kuchikku\", a song about friendship featuring the two.\n-------------------------------------------\nTo Enjoy Our Special Movie Collection Press The Following Link \nSuperhit Kannada Full Movies : https://youtube

ely be the case here considering her situation.\n\nThat night, Sudhakaran and Radha are sharing a double room in a hotel as two separate rooms were unavailable. While Radha was sleeping, Sudhakaran forces himself on her sexually, at first she resists but then she is submissive. They both perform intercourse. The next morning, Sudhakaran reveals her that he sexually approached her because of what the doctor said as Sukumaran is helpless. It shows result: Radha is relieved from her frequent headaches in the coming days.\n\nEventually, Radha gets pregnant, the family is shocked. Sudhakaran reveals it is his child but still hides what the doctor said. Rajasekharan condemns his son. Sudhakaran is willing to marry her. Finally, the family decides to get her married to Sudhakaran without informing Sukumaran. But Radha tells him everything. Unable to handle this new development, he losses his ability to speak. That night Sukumaran is killed by overdose of sleeping pills. Sudhakaran and Sunitha suspect Radha, while Radha suspects Sudhakaran. Breaking the suspense, Rajasekharan reveals that he killed his tormented son to end his misery. He calls the police and gets himself arrested.\n\nCast\nMohanlal as Sudhakaran\nMammootty as Sukumaran\nSeema as Radha\nK. P. Ummer as Colonel Rajasekharan\nKalaranjini as Sunitha\nP. K. Abraham as Dr. Mathews\nAdoor Bhasi as Radha's father\nKaviyoor Ponnamma as Radha's mother\nJanardhanan as Balachandra Menon\nSumithra as Vilasini\n\nSoundtrack\nThe music was composed by A. T. Ummer and the lyrics were written by Bichu Thirumala.\n\n                 Song                                  Singers                                                     Lyrics \n1 \"Aaranyakaandathiloode\"             K. J. Yesudas                                  Bichu Thirumala \n2 \"Enno Engengo\"                                 S. Janaki                                  Bichu Thirumala \n3 \"Manassinte Manchalil\"            K. J. Yesudas
